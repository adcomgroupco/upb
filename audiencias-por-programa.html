<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audiencias por programa — UPB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#1A1A1A;--yellow:#FFC000;--white:#fff;--bg:#F2F2F0;--t2:#2D2D2D;--t3:#999;--t4:#666;--purple:#534AB7;--blue:#185FA5;--amber:#BA7517;--green:#3B6D11;--border:#E5E5E3}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--black);font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{background:var(--black);padding:0 20px;display:flex;align-items:center;gap:10px;height:50px;flex-shrink:0;z-index:200}
.logo{width:32px;height:32px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--black);flex-shrink:0}
.topbar-title{color:#fff;font-size:13px;font-weight:500;flex:1;white-space:nowrap}
.date-badge{font-size:10px;color:rgba(255,255,255,0.4);white-space:nowrap}
#search{background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.2);border-radius:999px;padding:5px 14px;color:#fff;font-size:11px;font-family:'Poppins',sans-serif;outline:none;width:190px}
#search::placeholder{color:rgba(255,255,255,0.35)}
.fbtns{display:flex;gap:3px}
.fbtn{font-size:10px;padding:3px 10px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;font-family:'Poppins',sans-serif;transition:all 0.15s;white-space:nowrap}
.fbtn.on{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.4)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:252px;flex-shrink:0;background:var(--white);border-right:0.5px solid var(--border);overflow-y:auto;padding:8px 0}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:999px}
.sg-label{font-size:9px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--t3);padding:10px 14px 4px;display:flex;align-items:center;gap:5px}
.sg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.si{display:flex;align-items:flex-start;gap:8px;padding:6px 14px;cursor:pointer;border-left:3px solid transparent;transition:background 0.1s}
.si:hover{background:#F7F7F5}
.si.active{border-left-color:var(--purple);background:#F0EFFE}
.si.active.pre{border-left-color:var(--blue);background:#EBF2FB}
.si.active.open-u{border-left-color:var(--amber);background:#FDF5E6}
.si-num{font-size:9px;color:var(--t3);min-width:28px;padding-top:1px;flex-shrink:0}
.si-name{font-size:11px;color:var(--t2);line-height:1.4}
.si.hidden{display:none}
.sg.hidden{display:none}
.content{flex:1;overflow-y:auto;background:var(--bg)}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:999px}
.panel{display:none;padding:24px 28px 60px;max-width:920px}
.panel.vis{display:block}
.ph{margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--yellow)}
.ph-unit{font-size:9px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.ph-dot{width:7px;height:7px;border-radius:50%}
.ph-name{font-size:20px;font-weight:600;color:var(--black);line-height:1.3}
.tab-row{display:flex;gap:0;border-bottom:0.5px solid var(--border);margin-bottom:20px}
.tab{font-size:12px;padding:7px 16px;cursor:pointer;border:none;background:transparent;font-family:'Poppins',sans-serif;color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.tab.on{color:var(--black);border-bottom-color:var(--yellow);font-weight:500}
.tp{display:none}
.tp.on{display:block}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.meta-card{background:var(--white);border-radius:10px;border:0.5px solid var(--border);padding:16px}
.meta-card.full{grid-column:1/-1}
.meta-label{font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.meta-dot{width:6px;height:6px;border-radius:50%}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:400}
.tag-edu{background:#EAF3DE;color:#27500A}
.tag-tech{background:#E6F1FB;color:#0C447C}
.tag-biz{background:#FAEEDA;color:#633806}
.tag-hum{background:#FBEAF0;color:#72243E}
.tag-other{background:#F1EFE8;color:#5F5E5A}
.edu-chip{display:inline-block;font-size:11px;padding:4px 12px;border-radius:999px;font-weight:500;background:#EEEDFE;color:#3C3489}
.edu-chip.green{background:#EAF3DE;color:#27500A}
.age-chip{display:inline-block;font-size:11px;padding:4px 12px;border-radius:999px;font-weight:500;background:#FDF5E6;color:#8B5A00}
.extra-txt{font-size:11px;color:var(--t4);font-weight:300;line-height:1.7}
.no-meta{background:var(--white);border-radius:10px;border:0.5px solid var(--border);padding:20px;color:var(--t3);font-size:12px;text-align:center}
.kw-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kw-search{background:var(--white);border:0.5px solid var(--border);border-radius:999px;padding:5px 14px;font-size:11px;font-family:'Poppins',sans-serif;outline:none;width:200px;color:var(--t2)}
.kw-search::placeholder{color:var(--t3)}
.st-btn{font-size:10px;padding:3px 10px;border-radius:999px;border:0.5px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;font-family:'Poppins',sans-serif;transition:all 0.15s}
.st-btn.on{color:var(--black);background:var(--white);border-color:#999;font-weight:500}
.kw-count{font-size:11px;color:var(--t3);margin-left:auto}
.kw-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:10px;overflow:hidden;border:0.5px solid var(--border);font-size:11px}
.kw-table thead tr{background:var(--black)}
.kw-table th{padding:9px 12px;text-align:left;font-size:9px;font-weight:600;color:#fff;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap}
.kw-table th.num{text-align:right}
.kw-table td{padding:8px 12px;border-bottom:0.5px solid #F0F0F0;vertical-align:middle;color:var(--t2)}
.kw-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.kw-table tr:last-child td{border-bottom:none}
.kw-table tr:nth-child(even) td{background:#FAFAF9}
.kw-table tr.row-hidden{display:none}
.badge-act{display:inline-block;font-size:9px;padding:2px 7px;border-radius:999px;background:#EAF3DE;color:#27500A;font-weight:500}
.badge-pau{display:inline-block;font-size:9px;padding:2px 7px;border-radius:999px;background:#F5F5F5;color:#999;font-weight:400;border:0.5px solid #E0E0E0}
.ctr-wrap{display:flex;align-items:center;gap:6px}
.ctr-bg{background:#EEE;border-radius:999px;height:5px;width:55px;flex-shrink:0}
.ctr-fill{height:5px;border-radius:999px;background:var(--yellow)}
.ctr-v{font-size:10px;color:var(--t2);min-width:34px;text-align:right}
.conv-v{font-weight:500;color:var(--purple)}
.conv-z{color:var(--t3)}
.empty-msg{text-align:center;padding:30px;color:var(--t3);font-size:12px}
.empty-state{padding:60px 28px;color:var(--t3);text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">A</div>
  <span class="topbar-title">Audiencias por programa — UPB</span>
  <span class="date-badge">Google Ads: 14 abr – 13 may 2026</span>
  <input id="search" placeholder="Buscar programa..." oninput="doSearch()">
  <div class="fbtns">
    <button class="fbtn on" data-f="all" onclick="setFilter('all',this)">Todos</button>
    <button class="fbtn" data-f="posgrado" onclick="setFilter('posgrado',this)">Posgrado</button>
    <button class="fbtn" data-f="pregrado" onclick="setFilter('pregrado',this)">Pregrado</button>
    <button class="fbtn" data-f="open" onclick="setFilter('open',this)">Open</button>
  </div>
</div>
<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content">
    <div class="empty-state">Selecciona un programa del índice para ver su audiencia.</div>
  </div>
</div>

function tc(i){
  i=i.toLowerCase();
  if(['pedagogy','teacher','higher education','university','private university','legal education',"master's",'college','graduate school','postgraduate','vocational'].some(k=>i.includes(k)))return'tag-edu';
  if(['software','computer','information tech','data security','security','animation','3d','programming','intelligence','technology','high tech','emerging'].some(k=>i.includes(k)))return'tag-tech';
  if(['finance','mba','project management','management','small business','user experience','graphic design','creativity','content marketing','digital marketing','product design','web design','entrepreneurship','marketing','research','innovation'].some(k=>i.includes(k)))return'tag-biz';
  return'tag-hum';
}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  [{key:'posgrado',label:'Posgrado Virtual',color:'var(--purple)'},
   {key:'pregrado',label:'Pregrado Virtual',color:'var(--blue)'},
   {key:'open',label:'UPB Open',color:'var(--amber)'}].forEach(g=>{
    const progs=progNames.filter(n=>PROG[n].unit===g.key);
    if(!progs.length)return;
    const div=document.createElement('div');
    div.className='sg';div.dataset.unit=g.key;
    div.innerHTML=`<div class="sg-label"><span class="sg-dot" style="background:${g.color}"></span>${g.label}</div>`+
      progs.map(n=>`<div class="si ${unitClass[g.key]}" id="si-${n.replace(/[^a-z0-9]/gi,'_')}" data-id="${n}" onclick="openProg('${n.replace(/'/g,"\'")}')"><span class="si-num">${PROG[n].num}</span><span class="si-name">${n}</span></div>`).join('');
    sb.appendChild(div);
  });
}

function buildPanels(){
  const ct=document.getElementById('content');
  const es=ct.querySelector('.empty-state');
  progNames.forEach(name=>{
    const m=PROG[name];
    const meta=META_DATA[name];
    const kws=KW_DATA[name]||[];
    const key=name.replace(/[^a-z0-9]/gi,'_');
    const div=document.createElement('div');
    div.className='panel';div.id='pp-'+key;

    // META TAB content
    let metaHtml='';
    if(!meta){
      metaHtml='<div class="no-meta">Esta campaña no tiene audiencia de Meta configurada en este período.</div>';
    } else {
      const isPre=m.unit==='pregrado';
      const tags=meta.interests.map(i=>`<span class="tag ${tc(i)}">${i}</span>`).join('');
      metaHtml=`<div class="meta-grid">
        <div class="meta-card">
          <div class="meta-label"><span class="meta-dot" style="background:#C94C4C"></span>Intereses</div>
          <div class="tags">${tags}</div>
        </div>
        <div class="meta-card">
          <div class="meta-label"><span class="meta-dot" style="background:#888"></span>Segmentación</div>
          <div style="margin-bottom:8px"><span class="edu-chip ${isPre?'green':''}">${meta.edu}</span></div>
          ${meta.age&&meta.age!=='—'?`<div style="margin-bottom:8px"><span class="age-chip">Edad: ${meta.age}</span></div>`:''}
          ${meta.extra?`<div class="extra-txt">${meta.extra}</div>`:''}</div>
      </div>`;
    }

    // KW TABLE
    const rows=kws.map(k=>{
      const badge=k.estado==='activa'?'<span class="badge-act">activa</span>':'<span class="badge-pau">pausada</span>';
      const barW=Math.min(100,Math.round((k.ctr/20)*100));
      const ctrHtml=k.ctr>0?`<div class="ctr-wrap"><div class="ctr-bg"><div class="ctr-fill" style="width:${barW}%"></div></div><span class="ctr-v">${k.ctr.toFixed(2)}%</span></div>`:'<span class="ctr-v" style="color:var(--t3)">—</span>';
      const convClass=k.conv>0?'conv-v':'conv-z';
      return `<tr class="kw-row" data-estado="${k.estado}"><td>${k.kw}</td><td>${badge}</td><td class="num">${k.impr>0?k.impr.toLocaleString('es-CO'):'—'}</td><td class="num">${k.clics>0?k.clics.toLocaleString('es-CO'):'—'}</td><td>${ctrHtml}</td><td class="num ${convClass}">${k.conv>0?k.conv.toLocaleString('es-CO',{maximumFractionDigits:1}):'—'}</td></tr>`;
    }).join('');

    div.innerHTML=`
      <div class="ph">
        <div class="ph-unit"><span class="ph-dot" style="background:${unitColor[m.unit]}"></span>${unitLabel[m.unit]}</div>
        <div class="ph-name">${name}</div>
      </div>
      <div class="tab-row">
        <button class="tab on" onclick="switchTab(this,'meta-${key}')">Meta — Audiencia</button>
        <button class="tab" onclick="switchTab(this,'kw-${key}')">Google Ads — Palabras clave (${kws.length})</button>
      </div>
      <div class="tp on" id="meta-${key}">${metaHtml}</div>
      <div class="tp" id="kw-${key}">
        <div class="kw-toolbar">
          <input class="kw-search" placeholder="Buscar keyword..." oninput="filterKW(this,'${name.replace(/'/g,"\'")}')">
          <button class="st-btn on" onclick="filterStatus(this,'all','${name.replace(/'/g,"\'")}')">Todas</button>
          <button class="st-btn" onclick="filterStatus(this,'activa','${name.replace(/'/g,"\'")}')">Activas</button>
          <button class="st-btn" onclick="filterStatus(this,'pausada','${name.replace(/'/g,"\'")}')">Pausadas</button>
          <span class="kw-count" id="kc-${key}">${kws.length} keywords</span>
        </div>
        <table class="kw-table">
          <thead><tr>
            <th style="width:36%">Keyword</th><th style="width:8%">Estado</th>
            <th class="num" style="width:12%">Impresiones</th><th class="num" style="width:9%">Clics</th>
            <th style="width:16%">CTR</th><th class="num" style="width:10%">Conv.</th>
          </tr></thead>
          <tbody id="tb-${key}">${rows}</tbody>
        </table>
      </div>`;
    ct.insertBefore(div,es);
  });
}

function switchTab(btn,paneId){
  const panel=btn.closest('.panel');
  panel.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  panel.querySelectorAll('.tp').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById(paneId).classList.add('on');
}

const kwFilters={},stFilters={};
function filterKW(input,name){kwFilters[name]=(input.value||'').toLowerCase();applyKWFilter(name);}
function filterStatus(btn,status,name){
  stFilters[name]=status;
  btn.closest('.kw-toolbar').querySelectorAll('.st-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');applyKWFilter(name);
}
function applyKWFilter(name){
  const key=name.replace(/[^a-z0-9]/gi,'_');
  const tb=document.getElementById('tb-'+key);if(!tb)return;
  const q=kwFilters[name]||'',st=stFilters[name]||'all';
  let v=0;
  tb.querySelectorAll('.kw-row').forEach(r=>{
    const show=(!q||r.cells[0].textContent.toLowerCase().includes(q))&&(st==='all'||r.dataset.estado===st);
    r.classList.toggle('row-hidden',!show);if(show)v++;
  });
  const kc=document.getElementById('kc-'+key);if(kc)kc.textContent=v+' keywords';
}

function openProg(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('vis'));
  document.querySelectorAll('.si').forEach(s=>s.classList.remove('active'));
  document.querySelector('.empty-state').style.display='none';
  const key=name.replace(/[^a-z0-9]/gi,'_');
  const panel=document.getElementById('pp-'+key);
  if(panel){panel.classList.add('vis');panel.closest('.content').scrollTop=0;}
  const si=document.getElementById('si-'+key);
  if(si){si.classList.add('active');si.scrollIntoView({block:'nearest'});}
}

function doSearch(){
  const q=document.getElementById('search').value.toLowerCase();
  progNames.forEach(name=>{
    const key=name.replace(/[^a-z0-9]/gi,'_');
    const si=document.getElementById('si-'+key);
    const ok=(activeFilter==='all'||PROG[name].unit===activeFilter)&&(!q||name.toLowerCase().includes(q));
    if(si)si.classList.toggle('hidden',!ok);
  });
  document.querySelectorAll('.sg').forEach(g=>{
    g.classList.toggle('hidden',[...g.querySelectorAll('.si')].every(i=>i.classList.contains('hidden')));
  });
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');doSearch();
}

buildSidebar();buildPanels();openProg(progNames[0]);
</script>
</body>
</html>
